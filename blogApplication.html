<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Platform with Comments</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Initial Mock Data
    const INITIAL_USERS = [
      { id: '1', username: 'alex_dev', name: 'Alex Johnson', email: 'alex@example.com', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80', bio: 'Full-stack developer & tech enthusiast.' },
      { id: '2', username: 'sarah_design', name: 'Sarah Chen', email: 'sarah@example.com', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80', bio: 'UI/UX Designer writing about modern web interfaces.' }
    ];

    const INITIAL_POSTS = [
      {
        id: 'post-1',
        title: 'Building Modern Web Applications with React & Node.js',
        excerpt: 'Discover best practices for building scalable full-stack applications with clean architecture and modern tools.',
        content: `Building full-stack modern web applications requires a solid understanding of frontend responsiveness and backend robustness.\n\nKey pillars include:\n1. Clean REST API design\n2. Component-driven UI architecture\n3. Responsive and accessible CSS framework like Tailwind CSS\n4. Database state synchronization and state persistence.\n\nWhen scaling your application, ensure properly abstracted database queries and efficient state updates in React.`,
        category: 'Development',
        author: INITIAL_USERS[0],
        coverImage: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80',
        createdAt: '2023-10-24',
        likes: 12,
        comments: [
          {
            id: 'c-1',
            author: INITIAL_USERS[1],
            text: 'Great overview! What database do you recommend for real-time applications?',
            createdAt: '2023-10-24',
            replies: [
              {
                id: 'r-1',
                author: INITIAL_USERS[0],
                text: 'MongoDB with change streams or PostgreSQL with WebSockets works amazingly well!',
                createdAt: '2023-10-25'
              }
            ]
          }
        ]
      },
      {
        id: 'post-2',
        title: 'Mastering UI/UX Principles for Better User Retention',
        excerpt: 'How thoughtful typography, spacing, and micro-interactions elevate user experience and keep users engaged.',
        content: `Design is not just what it looks like and feels like. Design is how it works.\n\nWhen crafting modern web UI/UX:\n- Always prioritize visual hierarchy.\n- Keep contrast high for readability.\n- Give elements room to breathe with balanced padding and margins.\n- Provide instant feedback for user actions using subtle hover state animations and dynamic toasts.`,
        category: 'Design',
        author: INITIAL_USERS[1],
        coverImage: 'https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=800&q=80',
        createdAt: '2023-10-25',
        likes: 24,
        comments: []
      }
    ];

    function App() {
      // Persistence
      const [users, setUsers] = useState(() => JSON.parse(localStorage.getItem('blog_users')) || INITIAL_USERS);
      const [posts, setPosts] = useState(() => JSON.parse(localStorage.getItem('blog_posts')) || INITIAL_POSTS);
      const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem('blog_current_user')) || INITIAL_USERS[0]);

      // Navigation & Modals
      const [view, setView] = useState('feed'); // 'feed', 'post-detail', 'create-post'
      const [selectedPostId, setSelectedPostId] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showTutorial, setShowTutorial] = useState(false);
      const [toast, setToast] = useState(null);

      // Auth state
      const [authMode, setAuthMode] = useState('login'); // 'login' or 'register'
      const [authForm, setAuthForm] = useState({ username: '', name: '', email: '', password: '' });

      // Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');

      // Post Form
      const [editingPost, setEditingPost] = useState(null);
      const [postForm, setPostForm] = useState({ title: '', category: 'Development', coverImage: '', excerpt: '', content: '' });

      // Comment State
      const [commentText, setCommentText] = useState('');
      const [replyToId, setReplyToId] = useState(null);
      const [replyText, setReplyText] = useState('');

      useEffect(() => {
        localStorage.setItem('blog_users', JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        localStorage.setItem('blog_posts', JSON.stringify(posts));
      }, [posts]);

      useEffect(() => {
        localStorage.setItem('blog_current_user', JSON.stringify(currentUser));
      }, [currentUser]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // AUTH FUNCTIONS
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        if (authMode === 'register') {
          if (!authForm.username || !authForm.email || !authForm.name) return;
          const newUser = {
            id: 'u-' + Date.now(),
            username: authForm.username.toLowerCase(),
            name: authForm.name,
            email: authForm.email,
            avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${authForm.username}`,
            bio: 'Blogger & Content Creator'
          };
          setUsers([...users, newUser]);
          setCurrentUser(newUser);
          showNotification(`Welcome aboard, ${newUser.name}!`);
        } else {
          const found = users.find(u => u.username === authForm.username.toLowerCase() || u.email === authForm.username);
          if (found) {
            setCurrentUser(found);
            showNotification(`Welcome back, ${found.name}!`);
          } else {
            showNotification('User not found. Try registering!');
            return;
          }
        }
        setShowAuthModal(false);
        setAuthForm({ username: '', name: '', email: '', password: '' });
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('blog_current_user');
        showNotification('Logged out successfully');
      };

      // POST CRUD
      const handleSavePost = (e) => {
        e.preventDefault();
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }

        if (editingPost) {
          setPosts(posts.map(p => p.id === editingPost.id ? {
            ...p,
            ...postForm
          } : p));
          showNotification('Post updated successfully!');
        } else {
          const newPost = {
            id: 'post-' + Date.now(),
            ...postForm,
            author: currentUser,
            createdAt: new Date().toISOString().split('T')[0],
            likes: 0,
            comments: []
          };
          setPosts([newPost, ...posts]);
          showNotification('Post published successfully!');
        }

        setEditingPost(null);
        setPostForm({ title: '', category: 'Development', coverImage: '', excerpt: '', content: '' });
        setView('feed');
      };

      const openEditPost = (post) => {
        setEditingPost(post);
        setPostForm({
          title: post.title,
          category: post.category,
          coverImage: post.coverImage,
          excerpt: post.excerpt,
          content: post.content
        });
        setView('create-post');
      };

      const handleDeletePost = (postId) => {
        if (confirm('Are you sure you want to delete this blog post?')) {
          setPosts(posts.filter(p => p.id !== postId));
          showNotification('Post deleted.');
          setView('feed');
        }
      };

      const handleLikePost = (postId) => {
        setPosts(posts.map(p => p.id === postId ? { ...p, likes: p.likes + 1 } : p));
      };

      // COMMENTS & REPLIES
      const handleAddComment = (e) => {
        e.preventDefault();
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }
        if (!commentText.trim()) return;

        const newComment = {
          id: 'c-' + Date.now(),
          author: currentUser,
          text: commentText,
          createdAt: new Date().toISOString().split('T')[0],
          replies: []
        };

        setPosts(posts.map(p => {
          if (p.id === selectedPostId) {
            return { ...p, comments: [...p.comments, newComment] };
          }
          return p;
        }));

        setCommentText('');
        showNotification('Comment posted!');
      };

      const handleAddReply = (commentId) => {
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }
        if (!replyText.trim()) return;

        const newReply = {
          id: 'r-' + Date.now(),
          author: currentUser,
          text: replyText,
          createdAt: new Date().toISOString().split('T')[0]
        };

        setPosts(posts.map(p => {
          if (p.id === selectedPostId) {
            const updatedComments = p.comments.map(c => {
              if (c.id === commentId) {
                return { ...c, replies: [...(c.replies || []), newReply] };
              }
              return c;
            });
            return { ...p, comments: updatedComments };
          }
          return p;
        }));

        setReplyToId(null);
        setReplyText('');
        showNotification('Reply added!');
      };

      const categories = ['All', 'Development', 'Design', 'Technology', 'Tutorials'];

      const filteredPosts = posts.filter(p => {
        const matchesCategory = selectedCategory === 'All' || p.category === selectedCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.content.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const currentPost = posts.find(p => p.id === selectedPostId);

      return (
        <div class="min-h-screen flex flex-col bg-slate-50">

          {/* Toast Notification */}
          {toast && (
            <div class="fixed top-20 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 animate-bounce">
              <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
              <span class="text-sm font-medium">{toast}</span>
            </div>
          )}

          {/* NAVBAR */}
          <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2 cursor-pointer" onClick={() => setView('feed')}>
                  <div class="bg-indigo-600 text-white p-2 rounded-xl">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                  </div>
                  <span class="font-extrabold text-xl text-slate-900 tracking-tight">BlogPulse</span>
                </div>

                <button 
                  onClick={() => setShowTutorial(true)}
                  class="hidden sm:flex items-center space-x-1.5 text-xs font-semibold bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded-full hover:bg-red-100 transition"
                >
                  <i data-lucide="youtube" class="w-4 h-4 text-red-600"></i>
                  <span>Watch Task Tutorial</span>
                </button>
              </div>

              <div class="flex items-center space-x-3">
                <button 
                  onClick={() => setView('feed')} 
                  class={`px-3 py-1.5 text-xs font-semibold rounded-lg ${view === 'feed' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  Explore Feed
                </button>

                {currentUser ? (
                  <div class="flex items-center space-x-3">
                    <button 
                      onClick={() => {
                        setEditingPost(null);
                        setPostForm({ title: '', category: 'Development', coverImage: '', excerpt: '', content: '' });
                        setView('create-post');
                      }}
                      class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-1.5 rounded-xl flex items-center space-x-1 shadow-sm transition"
                    >
                      <i data-lucide="pen-tool" class="w-3.5 h-3.5"></i>
                      <span>Create Post</span>
                    </button>

                    <div class="flex items-center space-x-2 pl-2 border-l border-slate-200">
                      <img src={currentUser.avatar} class="w-8 h-8 rounded-full border border-indigo-200 object-cover" />
                      <div class="hidden md:block text-left">
                        <div class="text-xs font-bold text-slate-800 leading-tight">{currentUser.name}</div>
                        <div class="text-[10px] text-slate-400">@{currentUser.username}</div>
                      </div>
                      <button onClick={handleLogout} title="Logout" class="text-slate-400 hover:text-red-500 p-1">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                ) : (
                  <button 
                    onClick={() => setShowAuthModal(true)}
                    class="bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-xl hover:bg-slate-800 transition"
                  >
                    Sign In / Register
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

            {/* FEED VIEW */}
            {view === 'feed' && (
              <div>
                {/* Search & Filter Bar */}
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
                  <div class="relative w-full md:w-96">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input 
                      type="text" 
                      placeholder="Search articles & topics..." 
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                  </div>

                  <div class="flex flex-wrap gap-2 w-full md:w-auto">
                    {categories.map(cat => (
                      <button 
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        class={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${selectedCategory === cat ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Posts Grid */}
                {filteredPosts.length === 0 ? (
                  <div class="text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
                    <i data-lucide="file-text" class="w-12 h-12 text-slate-300 mx-auto mb-2"></i>
                    <h3 class="text-base font-semibold text-slate-700">No blog posts found</h3>
                    <p class="text-xs text-slate-400">Try adjusting your search terms or filters.</p>
                  </div>
                ) : (
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
                    {filteredPosts.map(post => (
                      <article key={post.id} class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
                        <div>
                          <div class="relative h-48 bg-slate-100 overflow-hidden cursor-pointer" onClick={() => { setSelectedPostId(post.id); setView('post-detail'); }}>
                            <img src={post.coverImage || 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=800&q=80'} class="w-full h-full object-cover hover:scale-105 transition duration-300" />
                            <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-md text-indigo-600 font-bold text-[10px] uppercase tracking-wider px-2.5 py-1 rounded-md shadow-sm">
                              {post.category}
                            </span>
                          </div>

                          <div class="p-6">
                            <div class="flex items-center space-x-2 text-xs text-slate-400 mb-2">
                              <span>By <strong class="text-slate-700">{post.author?.name}</strong></span>
                              <span>•</span>
                              <span>{post.createdAt}</span>
                            </div>

                            <h2 
                              onClick={() => { setSelectedPostId(post.id); setView('post-detail'); }}
                              class="font-bold text-slate-800 text-lg mb-2 hover:text-indigo-600 cursor-pointer transition line-clamp-2"
                            >
                              {post.title}
                            </h2>

                            <p class="text-slate-500 text-xs line-clamp-3 mb-4">{post.excerpt || post.content}</p>
                          </div>
                        </div>

                        <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-xs">
                          <div class="flex items-center space-x-4 text-slate-500">
                            <button onClick={() => handleLikePost(post.id)} class="flex items-center space-x-1 hover:text-red-500 transition">
                              <i data-lucide="heart" class="w-4 h-4"></i>
                              <span>{post.likes}</span>
                            </button>
                            <span class="flex items-center space-x-1 cursor-pointer" onClick={() => { setSelectedPostId(post.id); setView('post-detail'); }}>
                              <i data-lucide="message-square" class="w-4 h-4"></i>
                              <span>{post.comments?.length || 0} Comments</span>
                            </span>
                          </div>

                          {currentUser && currentUser.id === post.author?.id && (
                            <div class="flex space-x-2">
                              <button onClick={() => openEditPost(post)} class="text-slate-500 hover:text-indigo-600 p-1">
                                <i data-lucide="edit-2" class="w-4 h-4"></i>
                              </button>
                              <button onClick={() => handleDeletePost(post.id)} class="text-slate-500 hover:text-red-600 p-1">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                              </button>
                            </div>
                          )}
                        </div>
                      </article>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* FULL POST DETAIL & COMMENT SECTION VIEW */}
            {view === 'post-detail' && currentPost && (
              <div class="max-w-3xl mx-auto">
                <button 
                  onClick={() => setView('feed')}
                  class="mb-6 inline-flex items-center space-x-1 text-xs font-semibold text-slate-500 hover:text-indigo-600 transition"
                >
                  <i data-lucide="arrow-left" class="w-4 h-4"></i>
                  <span>Back to Articles</span>
                </button>

                <article class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm mb-8">
                  {currentPost.coverImage && (
                    <img src={currentPost.coverImage} class="w-full h-64 sm:h-80 object-cover" />
                  )}

                  <div class="p-6 sm:p-8">
                    <span class="inline-block bg-indigo-50 text-indigo-600 text-xs font-bold px-2.5 py-1 rounded-md uppercase tracking-wider mb-4">
                      {currentPost.category}
                    </span>

                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-4">{currentPost.title}</h1>

                    <div class="flex items-center justify-between pb-6 border-b border-slate-100 mb-6">
                      <div class="flex items-center space-x-3">
                        <img src={currentPost.author?.avatar} class="w-10 h-10 rounded-full object-cover border" />
                        <div>
                          <div class="text-xs font-bold text-slate-800">{currentPost.author?.name}</div>
                          <div class="text-[10px] text-slate-400">Published on {currentPost.createdAt}</div>
                        </div>
                      </div>

                      <div class="flex items-center space-x-3">
                        <button 
                          onClick={() => handleLikePost(currentPost.id)}
                          class="flex items-center space-x-1.5 bg-red-50 text-red-600 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-100 transition"
                        >
                          <i data-lucide="heart" class="w-4 h-4 fill-current"></i>
                          <span>{currentPost.likes} Likes</span>
                        </button>
                      </div>
                    </div>

                    <div class="prose max-w-none text-slate-700 text-sm leading-relaxed whitespace-pre-line">
                      {currentPost.content}
                    </div>
                  </div>
                </article>

                {/* COMMENTS SECTION */}
                <section class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm">
                  <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center space-x-2">
                    <i data-lucide="message-square" class="w-5 h-5 text-indigo-600"></i>
                    <span>Discussion ({currentPost.comments?.length || 0})</span>
                  </h3>

                  {/* Add New Comment */}
                  <form onSubmit={handleAddComment} class="mb-8">
                    <div class="flex items-start space-x-3">
                      <img src={currentUser ? currentUser.avatar : 'https://api.dicebear.com/7.x/avataaars/svg?seed=guest'} class="w-8 h-8 rounded-full border object-cover mt-1" />
                      <div class="flex-1">
                        <textarea 
                          rows="3"
                          placeholder={currentUser ? "Write a polite comment..." : "Please sign in to write a comment."}
                          disabled={!currentUser}
                          value={commentText}
                          onChange={(e) => setCommentText(e.target.value)}
                          class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                        ></textarea>
                        <div class="mt-2 flex justify-end">
                          <button 
                            type="submit" 
                            disabled={!currentUser || !commentText.trim()}
                            class={`px-4 py-2 rounded-xl text-xs font-semibold text-white transition ${
                              currentUser && commentText.trim() ? 'bg-indigo-600 hover:bg-indigo-700 shadow-sm' : 'bg-slate-300 cursor-not-allowed'
                            }`}
                          >
                            Post Comment
                          </button>
                        </div>
                      </div>
                    </div>
                  </form>

                  {/* Comments Tree */}
                  <div class="space-y-6">
                    {(!currentPost.comments || currentPost.comments.length === 0) ? (
                      <p class="text-xs text-slate-400 text-center py-4">No comments yet. Be the first to start the conversation!</p>
                    ) : (
                      currentPost.comments.map(comment => (
                        <div key={comment.id} class="border-b border-slate-100 pb-6 last:border-none">
                          <div class="flex items-start space-x-3">
                            <img src={comment.author?.avatar} class="w-8 h-8 rounded-full object-cover border" />
                            <div class="flex-1">
                              <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                                <div class="flex justify-between items-center mb-1">
                                  <span class="text-xs font-bold text-slate-800">{comment.author?.name}</span>
                                  <span class="text-[10px] text-slate-400">{comment.createdAt}</span>
                                </div>
                                <p class="text-xs text-slate-600">{comment.text}</p>
                              </div>

                              <div class="mt-1 ml-2">
                                <button 
                                  onClick={() => setReplyToId(replyToId === comment.id ? null : comment.id)}
                                  class="text-[11px] font-semibold text-indigo-600 hover:underline"
                                >
                                  Reply
                                </button>
                              </div>

                              {/* Nested Replies */}
                              {comment.replies && comment.replies.length > 0 && (
                                <div class="mt-3 pl-4 border-l-2 border-indigo-100 space-y-3">
                                  {comment.replies.map(reply => (
                                    <div key={reply.id} class="flex items-start space-x-2">
                                      <img src={reply.author?.avatar} class="w-6 h-6 rounded-full border object-cover mt-0.5" />
                                      <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 flex-1">
                                        <div class="flex justify-between items-center mb-1">
                                          <span class="text-[11px] font-bold text-slate-800">{reply.author?.name}</span>
                                          <span class="text-[9px] text-slate-400">{reply.createdAt}</span>
                                        </div>
                                        <p class="text-xs text-slate-600">{reply.text}</p>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              )}

                              {/* Reply Input */}
                              {replyToId === comment.id && (
                                <div class="mt-3 ml-4 flex items-center space-x-2">
                                  <input 
                                    type="text" 
                                    placeholder="Write a reply..." 
                                    value={replyText}
                                    onChange={(e) => setReplyText(e.target.value)}
                                    class="flex-1 border border-slate-200 rounded-xl px-3 py-1.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                                  />
                                  <button 
                                    onClick={() => handleAddReply(comment.id)}
                                    class="bg-indigo-600 text-white text-xs font-semibold px-3 py-1.5 rounded-xl hover:bg-indigo-700"
                                  >
                                    Reply
                                  </button>
                                </div>
                              )}

                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </section>
              </div>
            )}

            {/* CREATE / EDIT POST VIEW */}
            {view === 'create-post' && (
              <div class="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-xl font-bold text-slate-800 mb-6">
                  {editingPost ? 'Edit Blog Article' : 'Write a New Article'}
                </h2>

                <form onSubmit={handleSavePost} class="space-y-4">
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Article Title</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="e.g. Master React in 2026"
                      value={postForm.title}
                      onChange={(e) => setPostForm({ ...postForm, title: e.target.value })}
                      class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                  </div>

                  <div class="grid grid-cols-2 gap-4">
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
                      <select 
                        value={postForm.category}
                        onChange={(e) => setPostForm({ ...postForm, category: e.target.value })}
                        class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
                      >
                        <option value="Development">Development</option>
                        <option value="Design">Design</option>
                        <option value="Technology">Technology</option>
                        <option value="Tutorials">Tutorials</option>
                      </select>
                    </div>

                    <div>
                      <label class="block text-xs font-semibold text-slate-600 mb-1">Cover Image URL</label>
                      <input 
                        type="text" 
                        placeholder="https://..."
                        value={postForm.coverImage}
                        onChange={(e) => setPostForm({ ...postForm, coverImage: e.target.value })}
                        class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Short Excerpt</label>
                    <input 
                      type="text" 
                      placeholder="Brief summary for card preview..."
                      value={postForm.excerpt}
                      onChange={(e) => setPostForm({ ...postForm, excerpt: e.target.value })}
                      class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Article Content</label>
                    <textarea 
                      rows="8" 
                      required 
                      placeholder="Write your blog post content here..."
                      value={postForm.content}
                      onChange={(e) => setPostForm({ ...postForm, content: e.target.value })}
                      class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                    ></textarea>
                  </div>

                  <div class="flex justify-end space-x-2 pt-4">
                    <button 
                      type="button" 
                      onClick={() => setView('feed')}
                      class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      class="px-5 py-2 text-xs font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 shadow-sm"
                    >
                      Publish Post
                    </button>
                  </div>
                </form>
              </div>
            )}

          </main>

          {/* AUTHENTICATION MODAL */}
          {showAuthModal && (
            <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
                <button onClick={() => setShowAuthModal(false)} class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                  <i data-lucide="x" class="w-5 h-5"></i>
                </button>

                <div class="text-center mb-6">
                  <h3 class="font-extrabold text-slate-800 text-xl">
                    {authMode === 'login' ? 'Sign In to BlogPulse' : 'Create an Account'}
                  </h3>
                  <p class="text-xs text-slate-400 mt-1">
                    {authMode === 'login' ? 'Enter username or email to publish and comment.' : 'Join our blogging community today.'}
                  </p>
                </div>

                <form onSubmit={handleAuthSubmit} class="space-y-4">
                  {authMode === 'register' && (
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="John Doe"
                        value={authForm.name}
                        onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })}
                        class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                      />
                    </div>
                  )}

                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="e.g. alex_dev"
                      value={authForm.username}
                      onChange={(e) => setAuthForm({ ...authForm, username: e.target.value })}
                      class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                  </div>

                  {authMode === 'register' && (
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
                      <input 
                        type="email" 
                        required 
                        placeholder="alex@example.com"
                        value={authForm.email}
                        onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                        class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                      />
                    </div>
                  )}

                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <input 
                      type="password" 
                      required 
                      placeholder="••••••••"
                      value={authForm.password}
                      onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                      class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-indigo-500 outline-none"
                    />
                  </div>

                  <button 
                    type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-sm"
                  >
                    {authMode === 'login' ? 'Sign In' : 'Register Account'}
                  </button>
                </form>

                <div class="mt-4 text-center border-t border-slate-100 pt-4">
                  <button 
                    onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}
                    class="text-xs font-semibold text-indigo-600 hover:underline"
                  >
                    {authMode === 'login' ? "Don't have an account? Register here" : "Already have an account? Sign in"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TUTORIAL MODAL */}
          {showTutorial && (
            <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
                <button onClick={() => setShowTutorial(false)} class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                  <i data-lucide="x" class="w-5 h-5"></i>
                </button>

                <div class="flex items-center space-x-2 mb-4">
                  <i data-lucide="youtube" class="w-6 h-6 text-red-600"></i>
                  <h3 class="text-lg font-bold text-slate-800">Blogging Platform Tutorial</h3>
                </div>

                <div class="space-y-3 text-xs text-slate-600 mb-6">
                  <p>This application satisfies all specified features[cite: 2]:</p>
                  <ul class="list-disc pl-5 space-y-1.5 text-slate-500">
                    <li><strong class="text-slate-700">Authentication:</strong> Sign in / Register users dynamically[cite: 2].</li>
                    <li><strong class="text-slate-700">Post CRUD:</strong> Create, edit, and delete blog articles[cite: 2].</li>
                    <li><strong class="text-slate-700">Comments System:</strong> Interactive comment section with nested replies[cite: 2].</li>
                    <li><strong class="text-slate-700">Persistence:</strong> Automatically stores data locally simulating database APIs[cite: 2].</li>
                  </ul>
                </div>

                <button 
                  onClick={() => setShowTutorial(false)}
                  class="w-full bg-slate-900 text-white font-semibold py-2.5 rounded-xl text-xs hover:bg-slate-800"
                >
                  Got It!
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
